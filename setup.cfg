[flake8]
# The sources follow PEP 8 with a small tolerance for the long Klipper
# command strings and G-code format templates that would become harder to
# read when wrapped at 79 columns.
max-line-length = 100
# E731: short local lambdas are used deliberately as inline key functions.
# E122: pycodestyle misreads the closing bracket of the nested dict
#       comprehensions this project uses; the indentation is intentional.
extend-ignore = E731, E122
extend-exclude =
    .reference,
    .venv,
    build,
    backport,
    dashboard/node_modules

per-file-ignores =
    # The tests insert the src/ path before importing autopa.
    tests/*:E402
