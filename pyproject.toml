[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autopa-klipper"
version = "0.1.0.dev0"
description = "Synchronized Mellow FLY-ALPS and LIS2DW acquisition for Klipper"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "AutoPA contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
autopa-analyze = "autopa.analyze:main"
autopa-adaptive = "autopa.adaptive:main"
autopa-align = "autopa.align:main"
autopa-calibrate = "autopa.calibration:main"
autopa-diagnose = "autopa.diagnose:main"
autopa-dashboard = "autopa.dashboard:main"
autopa-filament = "autopa.filament:main"
autopa-material = "autopa.material:main"
autopa-temperature-plan = "autopa.temperature_plan:main"
autopa-quality = "autopa.quality:main"
autopa-record = "autopa.sync_recorder:main"
autopa-sweep = "autopa.sweep:main"

[tool.setuptools.packages.find]
where = ["src"]
