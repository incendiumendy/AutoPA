name: tests

on:
  push:
    branches: ["main", "afrei/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the version RatOS ships and therefore the real floor;
        # 3.12 guards against upcoming standard-library changes.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the dependency-free unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: python -m pip install --disable-pip-version-check flake8

      - name: Check the shipped Python sources
        run: python -m flake8 src/autopa klipper/extras scripts tests
